<!DOCTYPE html>

<head>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link rel ="stylesheet" href="style.css">
 
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <title>Frontend Mentor | Fylo data storage component</title>

<body>

    

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="row w-100 justify-content-center align-items-end">



 <div class ="col-12 col-lg-4 mb-4 mb-lg-0">
    <div class="left-card p-4">

<img src="logo.svg" alt="Fylo Logo">

<div class="d-flex gap-3 mt-4">

<button class ="icon-btn">
    <img src="icon-document.svg" alt="Documents Icon">
</button>


<button class ="icon-btn">
    <img src="icon-folder.svg" alt="Folder Icon">
</button>

<button class ="icon-btn">
    <img src="icon-upload.svg" alt="Upload Icon">
</button>

</div>

    </div>
</div>


    </div>
    </div>
  
<div class="col-12 col-lg-6">

<p> You've used <strong> 815 GB</strong> of your storage</p>

<div class="progress mb-3">
    <div class="progress-bar" role="progressbar" style="width: 81.5%;" aria-valuenow="81.5" aria-valuemin="0" aria-valuemax="100"></div>
</div>


<div class="d-flex justify-content-between">
    <strong> 0 GB</strong>
